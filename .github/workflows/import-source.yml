name: Import LPM portfolio source bundle

on:
  push:
    branches: [main]
    paths:
      - "LPM-System-Portfolio.tar.xz"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract prepared source tree
        shell: bash
        run: |
          test -f LPM-System-Portfolio.zip
          unzip -q LPM-System-Portfolio.zip -d /tmp/lpm-source
          cp -a /tmp/lpm-source/LPM-System-Portfolio/. .
          rm -rf /tmp/lpm-source LPM-System-Portfolio.zip
          rm -f .github/workflows/import-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: import sanitized LPM SPMI AMI application source"
          git push

  validate:
    needs: import
    runs-on: ubuntu-latest
    steps:
      - name: Check out imported source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, sqlite3, pdo_sqlite, fileinfo, xml, curl, zip
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Run Laravel tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          APP_DEMO_MODE: "true"
          INSTITUTION_EMAIL_DOMAIN: example.test
          LPM_DEMO_PASSWORD: test-demo-password
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan test
